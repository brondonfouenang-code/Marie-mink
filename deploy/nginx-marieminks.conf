# Reverse proxy Nginx pour Marie Minks.
#
# A installer dans /etc/nginx/sites-available/marieminks puis :
#   sudo ln -s /etc/nginx/sites-available/marieminks /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# Le certificat HTTPS s'obtient automatiquement avec certbot :
#   sudo certbot --nginx -d marieminks.co.uk -d www.marieminks.co.uk
#
# Puis decommentez le bloc "Redirection HTTPS" ci-dessous.

# --- Redirection HTTP vers HTTPS ------------------------------------------
# Decommentez ce bloc APRES avoir obtenu le certificat. Sans certificat,
# cette redirection casse le site.
#
# server {
#     listen 80;
#     listen [::]:80;
#     server_name marieminks.co.uk www.marieminks.co.uk;
#     return 301 https://$host$request_uri;
# }

server {
    listen 80;
    listen [::]:80;
    server_name marieminks.co.uk www.marieminks.co.uk;

    # --- En-tetes de securite ------------------------------------------------
    # Le serveur Node en pose deja quelques uns, mais Nginx est le point de
    # passage reel pour les visiteurs : c'est ici qu'on les fixe une fois.
    #
    # HSTS : le navigateur_INTERDIT de revenir en HTTP pendant un an. A
    # n'activer qu'une fois le HTTPS verifie, sinon le domaine devient
    # inutilisable si le certificat expire.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Empêche un tiers d'inclure le site dans une iframe (clickjacking).
    add_header X-Frame-Options "DENY" always;

    # Interdit au navigateur de deviner le type d'un fichier, ce qui peut
    # faire executer du JavaScript a la place d'une image.
    add_header X-Content-Type-Options "nosniff" always;

    # Ne transmet l'origine complete qu'a votre propre site : la page
    # "commande une fourrure" ne revele pas au site tiers d'ou vient
    # l'internaute.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Coupe les fonctions sensibles que le site n'utilise pas.
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # --- Limites de taille ---------------------------------------------------
    # LesPhotos produits peuvent etre volumineuses, mais 12 Mo reste
    # une limite raisonnable pour un envoi d'image.
    client_max_body_size 12M;

    # Les images ne changent jamais : on les garde un an. Les pages HTML et
    # les fichiers JS si, pour que les corrections se voient vite.
    location ~* \.(jpg|jpeg|png|webp|avif|gif|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # --- Securite des donnees ------------------------------------------------
    # Aucune requete ne doit atteindre le dossier data/ ou les fichiers
    # du serveur. Le serveur Node bloque deja de son cote, mais on ne fait
    # jamais confiance a une seule couche.
    location ~ ^/(data|deploy|\.) {
        deny all;
        return 404;
    }

    location ~* ^/(server\.js|package\.json|package-lock\.json)$ {
        deny all;
        return 404;
    }

    # Le back-office ne doit jamais etre indexe, ni par Google ni par
    # un moteur interne qui chercherait a lister les pages du site.
    location = /admin.html {
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    # --- Proxy vers le service Node ------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # En-tetes de la requete vers le service.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Indispensable : c'est ce header qui indique au serveur Node que la
        # connexion est securisee. Sans lui, le cookie de session ne recevra
        # pas l'attribut Secure et HSTS ne sera jamais pose.
        proxy_set_header X-Forwarded-Proto $scheme;

        # L'admin laisse parfois une connexion ouverte.
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Le serveur gere lui-meme ses erreurs et ses redirections :
        # on ne doit pas intercepter les codes 404 et 403 qu'il renvoie.
        proxy_intercept_errors off;
    }
}